<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NYANN SCRIPT HUB</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#050505;
    color:white;
    overflow:hidden;
    position:relative;
}

body::before{
    content:"";
    position:fixed;
    inset:0;
    background-image:
        linear-gradient(#ffffff08 1px,transparent 1px),
        linear-gradient(90deg,#ffffff08 1px,transparent 1px);
    background-size:40px 40px;
    mask-image:linear-gradient(to bottom,transparent,#000,transparent);
    pointer-events:none;
}

.floating-n{
    position:fixed;
    font-weight:900;
    color:#000;
    pointer-events:none;
    z-index:1;
    opacity:.3;
    user-select:none;
    animation:floatN linear infinite;
}

@keyframes floatN{
    0%{
        transform:translateY(100vh) rotate(0deg) scale(.8);
        opacity:.1;
    }

    10%{
        opacity:.3;
    }

    90%{
        opacity:.3;
    }

    100%{
        transform:translateY(-10vh) rotate(720deg) scale(1.2);
        opacity:0;
    }
}

.card{
    position:relative;
    width:90%;
    max-width:620px;
    background:#0b0b0b;
    border:1px solid #333;
    border-radius:18px;
    overflow:hidden;
    box-shadow:
        0 0 0 1px #ffffff08,
        0 0 40px #000;
    z-index:2;
}

.topbar{
    height:48px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 16px;
    border-bottom:1px solid #292929;
    background:#101010;
}

.dots{
    display:flex;
    gap:6px;
}

.dot{
    width:8px;
    height:8px;
    border-radius:50%;
    background:#555;
}

.status{
    color:#777;
    font-family:monospace;
    font-size:11px;
    letter-spacing:2px;
}

.logo-area{
    height:260px;
    display:flex;
    justify-content:center;
    align-items:center;
    position:relative;
    background:
        radial-gradient(
            circle,
            #202020 0%,
            #090909 55%,
            #050505 100%
        );
}

.logo-area::before{
    content:"";
    position:absolute;
    width:190px;
    height:190px;
    border:1px solid #444;
    transform:rotate(45deg);
    opacity:.4;
}

.logo-area::after{
    content:"N";
    position:absolute;
    font-size:230px;
    font-weight:900;
    color:#ffffff03;
}

.logo{
    position:relative;
    z-index:2;
    font-size:130px;
    font-weight:900;
    letter-spacing:-15px;
    color:white;
    text-shadow:
        4px 0 #555,
        -4px 0 #222;
}

.content{
    padding:22px;
}

.title{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:10px;
}

.title h1{
    font-size:22px;
    letter-spacing:1px;
}

.version{
    font-size:10px;
    color:#888;
    border:1px solid #444;
    padding:5px 8px;
    border-radius:5px;
}

.description{
    color:#777;
    font-size:13px;
    margin-bottom:15px;
}

.get-key{
    width:100%;
    margin-bottom:15px;
    padding:14px;
    border:1px solid #555;
    border-radius:9px;
    background:#151515;
    color:white;
    cursor:pointer;
    font-size:14px;
    letter-spacing:1px;
    transition:.2s;
}

.get-key:hover{
    background:white;
    color:black;
}

.get-key:active{
    transform:scale(.98);
}

.key-box{
    display:none;
    margin-bottom:15px;
}

.key-title{
    color:#888;
    font-family:monospace;
    font-size:11px;
    margin-bottom:8px;
}

.key-display{
    display:flex;
    gap:10px;
}

.key-text{
    flex:1;
    min-width:0;
    padding:13px;
    background:#050505;
    color:#7ee787;
    border:1px solid #333;
    border-radius:9px;
    font-family:monospace;
    font-size:12px;
    word-break:break-all;
    user-select:text;
}

.copy-key{
    padding:13px 16px;
    border:1px solid #555;
    border-radius:9px;
    background:#151515;
    color:white;
    cursor:pointer;
    font-size:12px;
    white-space:nowrap;
    transition:.2s;
}

.copy-key:hover{
    background:white;
    color:black;
}

.copy-key:active{
    transform:scale(.97);
}

.footer{
    padding:0 22px 18px;
    color:#555;
    font-family:monospace;
    font-size:10px;
}

#toast{
    position:fixed;
    bottom:25px;
    left:50%;
    transform:
        translateX(-50%)
        translateY(80px);

    background:#151515;
    border:1px solid #555;
    color:white;

    padding:13px 20px;

    border-radius:10px;

    font-family:monospace;
    font-size:13px;

    opacity:0;
    pointer-events:none;

    transition:.25s;

    z-index:9999;
}

#toast.show{
    transform:
        translateX(-50%)
        translateY(0);

    opacity:1;
}

@media(max-width:600px){

    body{
        padding:15px;
        overflow:auto;
    }

    .card{
        width:100%;
    }

    .logo-area{
        height:220px;
    }

    .logo{
        font-size:110px;
    }

    .title h1{
        font-size:17px;
    }

    .key-display{
        flex-direction:column;
    }

    .copy-key{
        width:100%;
    }

    .status{
        font-size:8px;
        letter-spacing:1px;
    }
}
</style>

/* ==================================================
   CHỮ N BAY
================================================== */

function createFloatingNs(){

    const fragment =
        document.createDocumentFragment();

    for(let i = 0; i < 100; i++){

        const n =
            document.createElement("div");

        n.className =
            "floating-n";

        n.textContent =
            "N";

        n.style.fontSize =
            (14 + Math.random() * 26) + "px";

        n.style.left =
            Math.random() * 100 + "%";

        n.style.animationDelay =
            Math.random() * 15 + "s";

        n.style.animationDuration =
            (12 + Math.random() * 8) + "s";

        fragment.appendChild(n);
    }

    document.body.appendChild(fragment);
}


/* ==================================================
   TOAST
================================================== */

let toastTimer = null;

function showToast(message){

    const toast =
        document.getElementById("toast");

    if(!toast){
        return;
    }

    toast.innerText =
        message;

    toast.classList.add("show");

    clearTimeout(toastTimer);

    toastTimer =
        setTimeout(function(){

            toast.classList.remove("show");

        },2000);
}


/* ==================================================
   HIỆN KEY
================================================== */

function showKey(key){

    const keyText =
        document.getElementById("keyText");

    const keyBox =
        document.getElementById("keyBox");

    if(!keyText || !keyBox){
        return;
    }

    keyText.textContent =
        key;

    keyBox.style.display =
        "block";
}


/* ==================================================
   GET KEY
================================================== */

function getKey(){

    if(!Array.isArray(Keys) ||
       Keys.length === 0){

        showToast(
            "✕ KEY LIST EMPTY"
        );

        return;
    }

    const randomIndex =
        Math.floor(
            Math.random() *
            Keys.length
        );

    const randomKey =
        Keys[randomIndex];

    if(!randomKey){

        showToast(
            "✕ KEY ERROR"
        );

        return;
    }

    showKey(randomKey);

    /*
       Lưu key hiện tại để khi reload
       trang vẫn giữ lại key.
    */
    try{

        localStorage.setItem(
            "NYANN_CURRENT_KEY",
            randomKey
        );

    }catch(error){

        console.warn(
            "LocalStorage unavailable:",
            error
        );
    }

    showToast(
        "✓ KEY GENERATED"
    );
}


/* ==================================================
   COPY KEY
================================================== */

async function copyKey(){

    const keyText =
        document.getElementById("keyText");

    const button =
        document.getElementById(
            "copyKeyButton"
        );

    if(!keyText){

        showToast(
            "✕ KEY ELEMENT ERROR"
        );

        return;
    }

    const key =
        keyText.textContent.trim();

    if(!key){

        showToast(
            "✕ NO KEY"
        );

        return;
    }


    /*
       CLIPBOARD API
    */

    try{

        if(
            navigator.clipboard &&
            typeof navigator.clipboard.writeText ===
            "function"
        ){

            await navigator.clipboard.writeText(
                key
            );

            button.innerText =
                "COPIED ✓";

            showToast(
                "✓ KEY COPIED"
            );

            setTimeout(function(){

                button.innerText =
                    "COPY KEY";

            },1500);

            return;
        }

    }catch(error){

        console.warn(
            "Clipboard API failed:",
            error
        );
    }


    /*
       FALLBACK COPY
       Hoạt động tốt hơn khi mở
       file HTML trực tiếp.
    */

    try{

        const textarea =
            document.createElement(
                "textarea"
            );

        textarea.value =
            key;

        textarea.setAttribute(
            "readonly",
            ""
        );

        textarea.style.position =
            "fixed";

        textarea.style.top =
            "0";

        textarea.style.left =
            "-10000px";

        textarea.style.width =
            "1px";

        textarea.style.height =
            "1px";

        textarea.style.opacity =
            "0";

        textarea.style.pointerEvents =
            "none";

        document.body.appendChild(
            textarea
        );

        textarea.focus();

        textarea.select();

        textarea.setSelectionRange(
            0,
            textarea.value.length
        );

        const success =
            document.execCommand(
                "copy"
            );

        textarea.remove();

        if(success){

            button.innerText =
                "COPIED ✓";

            showToast(
                "✓ KEY COPIED"
            );

            setTimeout(function(){

                button.innerText =
                    "COPY KEY";

            },1500);

            return;
        }

    }catch(error){

        console.warn(
            "Fallback copy failed:",
            error
        );
    }


    /*
       CUỐI CÙNG:
       TỰ CHỌN KEY ĐỂ USER COPY THỦ CÔNG.
    */

    try{

        const selection =
            window.getSelection();

        const range =
            document.createRange();

        range.selectNodeContents(
            keyText
        );

        selection.removeAllRanges();

        selection.addRange(
            range
        );

        showToast(
            "⚠ KEY ĐÃ ĐƯỢC CHỌN — COPY THỦ CÔNG"
        );

    }catch(error){

        showToast(
            "✕ COPY FAILED"
        );
    }
}


/* ==================================================
   BUTTON EVENTS
================================================== */

document

        "click",

    );


document
    .getElementById("copyKeyButton")

           Khôi phục key cũ nếu có.

                localStorage.getItem(
                    "NYANN_CURRENT_KEY"
                );

            if(
                savedKey &&
                Keys.includes(savedKey)
            ){

                showKey(
                    savedKey
                );

        }catch(error){

            console.warn(
                "Could not load saved key:",
                error
            );
        }

    }
);

</script>
